<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Пиксельная сцена рождения</title>
    <style>
      body {
        margin: 0;
        background: #edf0f8;
        color: #29354d;
        font-family: system-ui, sans-serif;
      }

      .pixel-preview {
        max-width: 1024px;
        margin: 0 auto;
        padding: 32px 20px;
      }

      .pixel-preview__title {
        font-size: 24px;
      }

      .pixel-preview__scene {
        display: block;
        width: 100%;
        border-radius: 16px;
        image-rendering: pixelated;
      }

      .pixel-preview__description {
        line-height: 1.6;
        color: #63718b;
      }

      .pixel-preview__sprites {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 32px;
        padding: 24px;
        border-radius: 16px;
        background: #ffffff;
        background-image: conic-gradient(
          #e7ebf3 25%,
          transparent 0 50%,
          #e7ebf3 0 75%,
          transparent 0
        );
        background-size: 16px 16px;
      }

      .pixel-preview__sprite {
        width: auto;
        height: 180px;
        image-rendering: pixelated;
      }

      .pixel-preview__sprite--baby {
        height: 108px;
      }

      @media (max-width: 600px) {
        .pixel-preview__sprites {
          gap: 16px;
          padding: 16px;
        }

        .pixel-preview__sprite {
          height: 135px;
        }

        .pixel-preview__sprite--baby {
          height: 81px;
        }
      }
    </style>
  </head>
  <body>
    <main class="pixel-preview">
      <h1 class="pixel-preview__title">Первый пример · рождение</h1>
      <img
        class="pixel-preview__scene"
        src="scene.png"
        alt="Пиксельная комната, мама, папа и младенец в люльке"
      />
      <p class="pixel-preview__description">
        Собственная пробная сцена на сетке 256 × 144 пикселя.
        Фон, взрослые и младенец сохранены отдельно. Игровой экран не изменён.
      </p>
      <div class="pixel-preview__sprites">
        <img
          class="pixel-preview__sprite"
          src="mother.png"
          alt="Мама на прозрачном фоне"
        />
        <img
          class="pixel-preview__sprite"
          src="father.png"
          alt="Папа на прозрачном фоне"
        />
        <img
          class="pixel-preview__sprite pixel-preview__sprite--baby"
          src="newborn.png"
          alt="Младенец в люльке на прозрачном фоне"
        />
      </div>
    </main>
  </body>
</html>
